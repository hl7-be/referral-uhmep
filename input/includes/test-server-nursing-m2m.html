<script>
document.querySelectorAll('details.test-server-example[data-requester]').forEach((details) => {
  details.addEventListener('toggle', async () => {
    if (!details.open || details.dataset.loaded) return;
    const code = details.querySelector('code');
    try {
      const response = await fetch(details.dataset.json);
      if (!response.ok) throw new Error('JSON request failed');
      const resource = await response.json();
      resource.status = 'active';
      resource.subject = {
        reference: details.dataset.subject || 'Patient/urn:be:fgov:pseudo:v2:{SEC1}:{transit-info}'
      };
      resource.requester = { reference: details.dataset.requester };
      if (details.dataset.orderDetailCode) {
        resource.orderDetail = [{
          coding: [{
            system: 'http://snomed.info/sct',
            ...(details.dataset.orderDetailVersion && { version: details.dataset.orderDetailVersion }),
            code: details.dataset.orderDetailCode
          }]
        }];
      }
      if (details.dataset.reasonCode) {
        resource.reasonCode = [{
          coding: [{ system: 'http://snomed.info/sct', code: details.dataset.reasonCode }]
        }];
      }
      if (details.dataset.validityStart) {
        const validity = resource.extension.find((extension) => extension.url.endsWith('/be-ext-validity-period'));
        validity.valuePeriod.start = details.dataset.validityStart;
      }
      delete resource.language;
      delete resource.text;
      code.textContent = JSON.stringify(resource, null, 2);
      details.dataset.loaded = 'true';
      if (window.Prism) Prism.highlightElement(code);
    } catch {
      code.textContent = 'Unable to load this JSON example.';
    }
  });
});
</script>
