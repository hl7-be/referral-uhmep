# This is a simple workflow that runs the publisher and copies the output to https://<owner>.github.io/<repo>/index.html
# Based on the instructions from Elliot Silver, available from: https://www.argentixinfo.com/archives/156

# Make sure your repo has a branch called gh-pages

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: 
      - main
      - master
      - releasecandidate
      - release-3.0.0
  pull_request:
    branches: 
      - main
      - master
      - draft
      - releasecandidate
      - release-3.0.0

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v4
      - name: Checkout DRP parent source
        uses: actions/checkout@v4
        with:
          repository: hl7-be/referral
          # Pin phase2-merged so parent profile changes are deliberate.
          ref: 6fd25e75767b8cfe51aa4adcfd36169de84136ad
          path: drp-parent
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install SUSHI
        run: npm install --global --no-audit --no-fund fsh-sushi@3.17.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install Jekyll
        run: gem install jekyll --version 4.4.1 --no-document
      - name: Download IG Publisher
        run: curl --fail --location --silent --show-error https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -o ./input-cache/publisher.jar --create-dirs

      - name: Build DRP parent package
        working-directory: drp-parent
        run: java -jar "$GITHUB_WORKSPACE/input-cache/publisher.jar" publisher -ig .

      - name: Install DRP parent package
        run: |
          package_dir="$HOME/.fhir/packages/hl7.fhir.be.drp#1.0.0-phase2-merged"
          mkdir -p "$package_dir"
          tar -xzf drp-parent/output/package.tgz -C "$package_dir"
          node - "$package_dir/package/package.json" <<'NODE'
          const fs = require('node:fs');
          const packagePath = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          if (manifest.name !== 'hl7.fhir.be.drp') {
            throw new Error(`Unexpected DRP package: ${manifest.name}`);
          }
          manifest.version = '1.0.0-phase2-merged';
          fs.writeFileSync(packagePath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          test -f "$package_dir/package/StructureDefinition-be-referral-servicerequest-diagnosticimaging.json"

      - name: Run the IG publisher
        run: java -jar ./input-cache/publisher.jar publisher -ig .

      - name: Deploy candidate
        uses: JamesIves/github-pages-deploy-action@4.1.4
        if: ${{ github.event_name != 'pull_request' && github.ref_name != github.event.repository.default_branch }}
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: ./output # The folder the action should deploy.
          commit-message: Deploy candidate branch
          target-folder: branches/${{ github.ref_name }}
          clean: false 

      - name: Deploy main
        uses: JamesIves/github-pages-deploy-action@4.1.4
        if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: ./output # The folder the action should deploy.
          commit-message: Deploy main branch
          clean-exclude: branches
